# Close pull requests after 90 days without activity. A PR is labelled
# `stale` with a warning comment at 83 days, then closed at 90 unless
# someone pushes, comments or removes the label in between. Draft PRs
# are closed the same way. Issues are left alone.
#
# A close made with GITHUB_TOKEN starts no other workflow, so nothing
# that runs on `pull_request: closed` fires for these closes.
name: Close stale PRs

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  # actions/stale keeps its state in the Actions cache and deletes it.
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          remove-issue-stale-when-updated: false
          days-before-pr-stale: 83
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >-
            This PR has had no activity for 83 days and will be closed in 7
            days. Push, comment or remove the `stale` label to keep it open.
          close-pr-message: Closed after 90 days without activity.
          operations-per-run: 300
